<!DOCTYPE html>
<html>
    <head>
        <title>Portfólio de Imagens</title>
    </head>
    <body>
        <h1>Meu Portfólio</h1>
        <h2>Galeria de Fotos</h2>
        <figure>
            <img src="imagens/foto1p1.png"
            alt="imagem de circuitos"
            width="300"
            height="200">
            <figcaption>
                Figura 1  : Imagem de circuitos.
            </figcaption>
        </figure>
        <figure>
            <img src="imagens/foto2p1.jpg"
            alt="imagem de homem de ferro"
            width="300"
            height="200">
            <figcaption>
                Figura 2 : Imagem do homem de ferro.
            </figcaption>
        </figure>
        <figure>
            <img src="imagens/foto3p1.webp"
            alt="imagem de dragao do mar"
            width="300"
            height="300">
            <figcaption>
                Figura 3 : imagem do dragao do mar.
            </figcaption>
        </figure>
    </body>
</html>
